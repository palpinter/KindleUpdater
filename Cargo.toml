[package]
name = "kindle-updater"
version = "0.1.0"
edition = "2024"
description = "Mirrors the local e-book library onto a Kindle over MTP"
repository = "https://github.com/palpinter/KindleUpdater"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dirs = "7.0.0"
gio = "0.22.10"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
